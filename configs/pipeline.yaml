schema_version: pipeline-1
# Paths are relative to this repository, or absolute on persistent storage.
download:
  catalog_path: corpus/catalog/documents.csv
  raw_root: corpus/raw
  log_root: corpus/logs/download
  max_documents: 5
  max_bytes: 52428800
  max_seconds: 300
  timeout_seconds: 20
  request_delay_seconds: 1
  max_requests: 50
  max_retries: 2
  max_retry_wait: 30
extraction:
  catalog_path: corpus/catalog/documents.csv
  raw_root: corpus/raw
  output_root: corpus/extracted/pages
  log_root: corpus/logs/extraction
  max_documents: 5
  max_pages: 500
  max_raw_bytes: 52428800
  max_page_bytes: 10485760
  max_output_bytes: 104857600
  max_seconds: 300
  command_timeout_seconds: 20
  min_text_chars: 20
  max_replacement_ratio: 0.02
